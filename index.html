<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>BEPPAN TERMINAL</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; color: #00ff66;
    font-family: "Consolas", "MS Gothic", "Menlo", monospace;
    cursor: default;
  }
  #screen { position: fixed; inset: 0; background: #000; transform-origin: center; }

  /* 走査線 */
  #screen::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.25) 0 1px, transparent 1px 3px);
    z-index: 50;
  }

  /* ===== パスワード画面 ===== */
  #login {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3vh; text-shadow: 0 0 10px #00ff66;
  }
  #login .title { font-size: 2.2vw; letter-spacing: .4em; opacity: .85; }
  #login .sub { font-size: 1.2vw; letter-spacing: .3em; opacity: .6; }
  #pw {
    width: 80vw; text-align: center;
    font-size: 9vw; font-family: inherit; font-weight: bold;
    background: transparent; border: none; outline: none;
    color: #00ff66; caret-color: #00ff66;
    border-bottom: 3px solid #00ff66;
    text-shadow: 0 0 20px #00ff66;
  }
  #msg { font-size: 2vw; height: 3vw; letter-spacing: .3em; }
  #msg.ng { color: #ff2244; text-shadow: 0 0 12px #ff2244; }
  .shake { animation: shake .35s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-25px); } 40% { transform: translateX(25px); }
    60% { transform: translateX(-15px); } 80% { transform: translateX(15px); }
  }

  /* ===== テレビが消える演出 ===== */
  .tvoff { animation: tvoff .7s cubic-bezier(.6,0,.4,1) forwards; }
  @keyframes tvoff {
    0%   { transform: scale(1,1);        filter: brightness(1); }
    45%  { transform: scale(1,.004);     filter: brightness(6); background:#fff; }
    75%  { transform: scale(.003,.004);  filter: brightness(10); background:#fff; }
    100% { transform: scale(0,0);        filter: brightness(10); opacity: 0; }
  }
  #dot {
    position: fixed; left: 50%; top: 50%; width: 6px; height: 6px;
    margin: -3px 0 0 -3px; border-radius: 50%; background: #fff;
    box-shadow: 0 0 30px 12px #fff; opacity: 0; pointer-events: none;
  }
  #dot.on { animation: dot .45s ease-out forwards; }
  @keyframes dot { 0% { opacity: 1; transform: scale(1.5); } 100% { opacity: 0; transform: scale(0); } }

  .tvon { animation: tvon .3s ease-out forwards; }
  @keyframes tvon {
    0%   { transform: scale(1,.004); filter: brightness(8); }
    100% { transform: scale(1,1);    filter: brightness(1); }
  }

  /* ===== ハッキング画面 ===== */
  #hack { position: absolute; inset: 0; display: none; }
  #rain { position: absolute; inset: 0; opacity: .35; }
  #log {
    position: absolute; left: 2vw; top: 2vh; width: 60vw; height: 80vh;
    overflow: hidden; font-size: 1.05vw; line-height: 1.35;
    white-space: pre; text-shadow: 0 0 6px #00ff66;
    display: flex; flex-direction: column; justify-content: flex-end;
  }
  #log .warn { color: #ffcc00; text-shadow: 0 0 6px #ffcc00; }
  #log .err  { color: #ff2244; text-shadow: 0 0 6px #ff2244; }
  #log .ok   { color: #fff;    text-shadow: 0 0 8px #00ff66; }
  #side {
    position: absolute; right: 2vw; top: 2vh; width: 34vw; height: 80vh;
    border: 1px solid #00ff66; padding: 1.2vw; font-size: 1.2vw;
    box-shadow: 0 0 20px rgba(0,255,102,.3) inset; overflow: hidden;
  }
  #side .row { display: flex; justify-content: space-between; margin: .3vw 0; }
  #hex { margin-top: 1vw; opacity: .7; white-space: pre; line-height: 1.3; }
  #bar {
    position: absolute; left: 2vw; right: 2vw; bottom: 5vh; height: 4vh;
    border: 2px solid #00ff66; box-shadow: 0 0 15px #00ff66;
  }
  #fill { height: 100%; width: 0%; background: #00ff66; box-shadow: 0 0 25px #00ff66; }
  #pct {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 1.6vw; font-weight: bold; mix-blend-mode: difference; color: #fff;
  }
  #granted {
    position: absolute; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    background: rgba(0,0,0,.75); z-index: 20;
  }
  #granted .big {
    font-size: 9vw; font-weight: bold; letter-spacing: .1em;
    color: #00ff66; text-shadow: 0 0 30px #00ff66, 0 0 60px #00ff66;
    animation: glitch .25s steps(2) 3;
  }
  #granted .small { font-size: 2vw; letter-spacing: .5em; margin-top: 2vh; }
  @keyframes glitch {
    0%   { transform: translate(0,0);  text-shadow: 4px 0 #ff0044, -4px 0 #00ccff; }
    50%  { transform: translate(-6px,3px); text-shadow: -6px 0 #ff0044, 6px 0 #00ccff; }
    100% { transform: translate(0,0);  text-shadow: 0 0 30px #00ff66; }
  }
  .flash { animation: flash .15s; }

  /* 段階切り替えバナー */
  #phase {
    position: absolute; left: 50%; top: 45%; transform: translate(-50%,-50%);
    padding: 1.4vw 4vw; border: 3px solid #00ff66; background: rgba(0,0,0,.88);
    text-align: center; display: none; z-index: 15; white-space: nowrap;
  }
  #phase .n { font-size: 1.3vw; letter-spacing: .5em; opacity: .85; margin-bottom: .6vw; }
  #phase .t { font-size: 4vw; font-weight: bold; letter-spacing: .1em; }
  #phase.show { display: block; animation: phaseIn 1.1s forwards; }
  @keyframes phaseIn {
    0%   { opacity: 0; transform: translate(-50%,-50%) scale(1.5); filter: brightness(3); }
    12%  { opacity: 1; transform: translate(-50%,-50%) scale(1);   filter: brightness(1); }
    20%  { transform: translate(calc(-50% - 8px),-50%); }
    25%  { transform: translate(calc(-50% + 8px),-50%); }
    30%  { transform: translate(-50%,-50%); }
    80%  { opacity: 1; }
    100% { opacity: 0; }
  }
  /* 右パネルの値が変わった瞬間 */
  #side .row span:last-child { font-weight: bold; }
  .hl { animation: hl 1.4s; }
  @keyframes hl {
    0%, 30%, 60% { background: rgba(0,255,102,.8); box-shadow: 0 0 30px #00ff66; color: #000; }
    15%, 45%     { background: transparent; box-shadow: none; }
    100%         { background: transparent; box-shadow: none; }
  }
  .hl span:last-child { display: inline-block; animation: pop .8s ease-out; transform-origin: right center; }
  @keyframes pop { 0% { transform: scale(1.8); } 100% { transform: scale(1); } }
  .blink { animation: blink .4s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  @keyframes flash { 0% { filter: brightness(4) invert(1); } 100% { filter: none; } }
</style>
</head>
<body>
<div id="screen">

  <div id="login">
    <div class="title">BEPPAN SECURE TERMINAL</div>
    <div class="sub">別班専用回線 ― 接触コードを入力せよ</div>
    <input id="pw" type="text" autocomplete="off" spellcheck="false" autofocus>
    <div id="msg"></div>
    <div class="sub" style="font-size:.9vw;opacity:.35">[ENTER] で認証</div>
  </div>

  <div id="hack">
    <canvas id="rain"></canvas>
    <div id="log"></div>
    <div id="side">
      <div style="font-size:1.3vw;margin-bottom:.8vw">■ OPERATION : 卒業おめでとう</div>
      <div class="row"><span>回線</span><span id="ip">---</span></div>
      <div class="row"><span>接触コード</span><span id="port">32118</span></div>
      <div class="row"><span>公安の監視</span><span id="fw" style="color:#ff2244">監視中</span></div>
      <div class="row"><span>写真データ</span><span id="enc" style="color:#ff2244">「う」未取得</span></div>
      <div class="row"><span>任務状況</span><span id="st">CONNECTING</span></div>
      <div id="hex"></div>
    </div>
    <div id="phase"><div class="n" id="phaseN"></div><div class="t" id="phaseT"></div></div>
    <div id="bar"><div id="fill"></div><div id="pct">0%</div></div>
    <div id="granted">
      <div class="big">ACCESS GRANTED</div>
      <div class="small">別班 ― 任務を開始せよ</div>
    </div>
  </div>

</div>
<div id="dot"></div>

<script>
const PASSWORD = "oicont";
const HACK_MS = 9000;   // ハッキング演出の長さ（ミリ秒）

const SOUND = true;     // 効果音を消したいときは false

// ===== 効果音（音声ファイル不要・ブラウザで合成） =====
let ac = null, master = null;
function audio() {
  if (!SOUND) return null;
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ac = new AC(); master = ac.createGain(); master.gain.value = .9; master.connect(ac.destination);
  }
  if (ac.state === "suspended") ac.resume();
  return ac;
}
function tone(freq, dur, type = "square", vol = .08, when = 0, slideTo = 0) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + when;
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol = .15, when = 0, lp = 0) {
  const a = audio(); if (!a) return;
  const len = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = a.createBufferSource(), g = a.createGain(), t = a.currentTime + when;
  src.buffer = buf; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  let node = src;
  if (lp) { const f = a.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = lp; node.connect(f); node = f; }
  node.connect(g).connect(master); src.start(t);
}
let drone = null;
const sfx = {
  key:    () => tone(900 + Math.random() * 700, .035, "square", .05),
  ok:     () => { tone(660, .09, "square", .1); tone(990, .16, "square", .1, .1); },
  ng:     () => { tone(150, .3, "sawtooth", .18); tone(110, .4, "sawtooth", .18, .2); },
  tvoff:  () => { tone(1800, .55, "sine", .15, 0, 50); noise(.3, .25, 0, 3000); tone(3500, .05, "sine", .12, .55); },
  tvon:   () => { noise(.35, .18, 0, 5000); tone(60, .35, "sawtooth", .12, 0, 400); },
  blip:   () => tone(800 + Math.random() * 1800, .02, "square", .025),
  err:    () => tone(220, .09, "sawtooth", .06),
  glitch: () => noise(.06, .12),
  alert:  (urgent) => {
    const f = urgent ? 520 : 880;
    for (let i = 0; i < 3; i++) tone(f, .09, "square", .13, i * .13);
  },
  change: () => { tone(1500, .06, "triangle", .16); tone(2300, .14, "triangle", .14, .07); },
  granted: () => {
    tone(120, .9, "sine", .45, 0, 35); noise(.6, .2, 0, 1500);
    [523, 659, 784, 1046].forEach((f, i) => tone(f, 1.4, "sawtooth", .05, .05 + i * .04));
    [523, 659, 784, 1046].forEach((f, i) => tone(f, 1.6, "sine", .08, .05 + i * .04));
  },
  droneStart: () => {
    const a = audio(); if (!a || drone) return;
    const o = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain();
    o.type = "sawtooth"; o.frequency.value = 55; f.type = "lowpass"; f.frequency.value = 300;
    g.gain.setValueAtTime(.0001, a.currentTime); g.gain.exponentialRampToValueAtTime(.06, a.currentTime + .5);
    o.connect(f).connect(g).connect(master); o.start(); drone = { o, g, f };
  },
  droneRise: (p) => { if (drone) { drone.o.frequency.value = 55 + p * 55; drone.f.frequency.value = 300 + p * 900; } },
  droneStop: () => {
    if (!drone) return; const a = audio();
    drone.g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + .3); drone.o.stop(a.currentTime + .35); drone = null;
  },
};

const $ = id => document.getElementById(id);
const screen = $("screen"), pw = $("pw"), msg = $("msg");

// 最初のクリック or キー入力の瞬間に全画面化（ブラウザの仕様上、開いた瞬間には不可）
function goFull() {
  const el = document.documentElement;
  if (document.fullscreenElement || document.webkitFullscreenElement) return;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (req) { const r = req.call(el, { navigationUI: "hide" }); if (r && r.catch) r.catch(() => {}); }
}
["pointerdown", "keydown", "touchstart"].forEach(ev =>
  document.addEventListener(ev, e => { if (e.key !== "Escape") { goFull(); audio(); } }, true)
);
document.addEventListener("click", () => pw.focus());
window.addEventListener("load", () => pw.focus());

// 全角英字・大文字・空白を吸収して判定
const norm = s => s.normalize("NFKC").replace(/\s/g, "").toLowerCase();

pw.addEventListener("keydown", e => {
  if (!pw.disabled && (e.key.length === 1 || e.key === "Backspace" || e.key === "Process")) sfx.key();
  if (e.key !== "Enter" || e.isComposing || e.keyCode === 229) return; // 変換確定のEnterは無視
  if (norm(pw.value) === norm(PASSWORD)) {
    msg.className = ""; msg.textContent = "ACCESS CODE ACCEPTED"; sfx.ok();
    pw.blur(); pw.disabled = true;
    setTimeout(tvOff, 350);
  } else {
    msg.className = "ng"; msg.textContent = "ACCESS DENIED"; sfx.ng();
    $("login").classList.remove("shake"); void $("login").offsetWidth;
    $("login").classList.add("shake");
    pw.value = "";
  }
});

// テレビが消える → 少し暗転 → 点く
function tvOff() {
  screen.classList.add("tvoff"); sfx.tvoff();
  setTimeout(() => $("dot").classList.add("on"), 550);
  setTimeout(() => {
    $("login").style.display = "none";
    $("hack").style.display = "block";
    screen.classList.remove("tvoff");
    screen.style.opacity = 0;
  }, 750);
  setTimeout(() => {
    screen.style.opacity = 1;
    screen.classList.add("tvon"); sfx.tvon();
    startHack();
  }, 1150);
}

// ===== ハッキング演出 =====
function startHack() {
  const t0 = performance.now();
  const log = $("log"), fill = $("fill"), pct = $("pct");
  const rnd = n => Math.floor(Math.random() * n);
  const hex = n => Array.from({length:n}, () => rnd(256).toString(16).padStart(2,"0")).join("").toUpperCase();
  const ip = () => `${rnd(223)+1}.${rnd(256)}.${rnd(256)}.${rnd(256)}`;

  const lines = [
    ["", () => `> connect --unit beppan --code 32118 --port ${rnd(60000)+1024}`],
    ["", () => `[*] 別班データベースに接続 ${ip()} ...`],
    ["", () => `[*] Handshake 0x${hex(4)} ... OK`],
    ["", () => `[*] 卒業生リスト取得 : 4年生 / 6年生 ... OK`],
    ["", () => `[*] 写真データ照合 「卒」「業」「お」「め」「で」「と」 ... OK`],
    ["warn", () => `[!] 残り1枚 「う」 未取得`],
    ["warn", () => `[!] 公安の追跡を検知 — 経路変更 via ${ip()}`],
    ["err", () => `[x] 卒業生に気づかれるリスク : HIGH`],
    ["", () => `[*] メニュー隊ネットワークに侵入 ${hex(6)}`],
    ["", () => `[*] 7号館2階 端末に接続 ... open`],
    ["", () => `[*] 秋合宿ログ 復号中 #${rnd(9999)} :: ${hex(10)}`],
    ["", () => `[*] 水泳部 部員名簿を照合中 ${hex(8)}`],
    ["err", () => `[x] 協力者 3名の信号ロスト  retry ${rnd(9)+1}/9`],
    ["", () => `[*] Proxy chain ${rnd(9)+2} hops established`],
    ["ok", () => `[+] 司令部キー断片を回収 : ${hex(10)}`],
    ["ok", () => `[+] 接触コード 32118 認証 ... OK`],
  ];

  function addLine() {
    const [cls, fn] = lines[rnd(lines.length)];
    const d = document.createElement("div");
    d.className = cls; d.textContent = fn();
    if (cls === "err" && Math.random() < .3) sfx.err();
    log.appendChild(d);
    while (log.children.length > 60) log.removeChild(log.firstChild);
  }

  // マトリックス風の雨
  const cv = $("rain"), cx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  const fs = 18, cols = Math.floor(cv.width / fs);
  const drops = Array(cols).fill(0).map(() => rnd(cv.height / fs));
  const chars = "アイウエオカキクケコサシスセソ0123456789ABCDEF別班卒業おめでとう任務";

  // 段階（開始位置, 表示, 色, 緊迫感）
  const stages = [
    [0.00, "別班回線に接続中",     "#00ff66", false],
    [0.20, "公安の監視を回避中",   "#ffcc00", true ],
    [0.45, "写真データを復号中",   "#00ff66", false],
    [0.70, "司令部の承認を待機中", "#ff2244", true ],
    [0.90, "任務データ転送中",     "#00ccff", false],
  ];
  let lastStage = -1;
  function showPhase(i) {
    const [, text, color] = stages[i], el = $("phase");
    $("phaseN").textContent = `PHASE ${i + 1} / ${stages.length}`;
    $("phaseT").textContent = text;
    el.style.color = color; el.style.borderColor = color; el.style.boxShadow = `0 0 40px ${color}`;
    el.classList.remove("show"); void el.offsetWidth; el.classList.add("show");
  }
  // 右パネルの値を変えて、その行を光らせる＋ログにも出す
  function setVal(id, text, color, logText) {
    const el = $(id); el.textContent = text; el.style.color = color;
    const row = el.parentElement; row.classList.remove("hl"); void row.offsetWidth; row.classList.add("hl");
    const d = document.createElement("div"); d.className = "ok"; d.textContent = logText; log.appendChild(d);
    sfx.change();
  }
  const done = {};
  sfx.droneStart();

  let granted = false;
  function frame(now) {
    const t = now - t0;
    const p = Math.min(1, t / (HACK_MS - 500));

    // 雨
    cx.fillStyle = "rgba(0,0,0,.12)"; cx.fillRect(0, 0, cv.width, cv.height);
    cx.fillStyle = "#00ff66"; cx.font = fs + "px monospace";
    drops.forEach((y, i) => {
      cx.fillText(chars[rnd(chars.length)], i * fs, y * fs);
      drops[i] = (y * fs > cv.height && Math.random() > .95) ? 0 : y + 1;
    });

    // ログ
    for (let i = 0; i < 2; i++) addLine();

    // 進捗
    // 段階が変わった瞬間にバナー＋警告音
    let si = 0; stages.forEach((s, i) => { if (p >= s[0]) si = i; });
    const stage = stages[si][1];
    if (si !== lastStage && !granted) { lastStage = si; showPhase(si); sfx.alert(stages[si][3]); }
    const eased = p < .6 ? p * 1.1 : p < .8 ? .66 + (p - .6) * .3 : .72 + (p - .8) * 1.4; // 66〜78%あたりで粘る
    const shown = p >= 1 ? 100 : Math.min(99, Math.floor(eased * 100 + 1e-6));
    fill.style.width = shown + "%";
    pct.textContent = shown < 100 ? `${stage}... ${shown}%` : "100% 任務承認";
    pct.classList.toggle("blink", si === 3 && shown < 100);   // 承認待ちの間は点滅
    sfx.droneRise(p);
    if (Math.random() < .35) sfx.blip();

    // サイドパネル
    $("ip").textContent = ip();
        $("hex").textContent = Array.from({length:14}, () => hex(10).match(/../g).join(" ")).join("\n");
    if (p >= .45 && !done.fw)  { done.fw = 1;  setVal("fw",  "回避成功",          "#00ff66", "[+] ▶ 公安の監視を回避しました"); }
    if (p >= .70 && !done.enc) { done.enc = 1; setVal("enc", "「う」以外 取得済", "#ffcc00", "[+] ▶ 写真データの復号に成功しました"); }
    if (p >= 1  && !done.st)   { done.st = 1;  setVal("st",  "任務開始",          "#00ff66", "[+] ▶ 司令部の承認を確認しました"); }
    if (!done.st) $("st").textContent = "潜入中";

    // ランダムなグリッチ
    if (Math.random() < .04) { screen.classList.remove("flash"); void screen.offsetWidth; screen.classList.add("flash"); sfx.glitch(); }

    if (t >= HACK_MS - 500 && !granted) {
      granted = true;
      screen.classList.remove("flash"); void screen.offsetWidth; screen.classList.add("flash");
      $("granted").style.display = "flex";
      $("phase").classList.remove("show");
      sfx.droneStop(); sfx.granted();
    }
    if (t < HACK_MS) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
